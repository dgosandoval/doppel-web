<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>LATAM 360 · Mapa del recorrido — BORRADOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- Leaflet (mapa interactivo, CDN) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>

<div class="draft-flag" title="Borrador interno: no publicado">Borrador · no publicado</div>

<header class="top">
  <div class="top__brand">
    <img src="/latam360/assets/latam-logo.svg" alt="LATAM" />
    <span class="sep"></span>
    <span class="t">RECORRIDO 360</span>
  </div>
  <nav class="navlinks">
    <a class="hot" href="tour/?ciudad=santiago">▶ Visor · CCO</a>
  </nav>
</header>

<!-- MAPA (Leaflet): 6 ciudades con su tarjeta -->
<main class="mappage" id="mapa">
  <div class="mapwrap">
    <div class="mapside">
      <div class="eyebrow">La red</div>
      <h2>6 países, 6 locaciones.</h2>
      <p class="lead">Toca un punto del mapa para ver cada locación del recorrido.</p>
      <div class="paises" id="city-list"></div>
    </div>
    <div class="mapstage">
      <div id="map" role="region" aria-label="Mapa de locaciones del proyecto"></div>
      <aside class="citycard" id="citycard" hidden>
        <button class="citycard__close" id="citycard-close" aria-label="Cerrar">×</button>
        <div class="citycard__body" id="citycard-body"></div>
      </aside>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/js/site.js"></script>
</body>
</html>

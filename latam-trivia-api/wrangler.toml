name = "latam-trivia-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Se monta sobre el sitio de Pages solo en esta ruta; el resto de doppel.cl no se toca.
routes = [
  { pattern = "doppel.cl/latam-seguridad/api/*", zone_name = "doppel.cl" }
]

[[d1_databases]]
binding = "DB"
database_name = "latam-trivia-db"
database_id = "e1fee0f2-dc1e-4819-9dcd-8b2259520f6a"

[observability]
enabled = true
